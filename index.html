<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cyber Gesture Shooter Pro</title>
                <style>
                        body { margin: 0; overflow: hidden; background: #020205; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
                                #loading-overlay {
                                            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                                                        background: radial-gradient(circle, #1a1a2e 0%, #000 100%);
                                                                    display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: #00fff2;
                                                                            }
                                                                                    .spinner {
                                                                                                width: 60px; height: 60px; border: 4px solid rgba(0, 255, 242, 0.1);
                                                                                                            border-top: 4px solid #00fff2; border-radius: 50%;
                                                                                                                        animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; margin-bottom: 20px;
                                                                                                                                }
                                                                                                                                        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                                                                                                                                                #ui { position: absolute; top: 30px; left: 30px; color: #00fff2; font-size: 28px; font-weight: bold; text-shadow: 0 0 10px #00fff2; pointer-events: none; }
                                                                                                                                                        #video-hidden { display: none; }
                                                                                                                                                            </style>
                                                                                                                                                            </head>
                                                                                                                                                            <body>

                                                                                                                                                            <div id="loading-overlay">
                                                                                                                                                                <div class="spinner"></div>
                                                                                                                                                                    <div id="status">INITIALIZING NEON SYSTEMS...</div>
                                                                                                                                                                    </div>

                                                                                                                                                                    <div id="ui">CYBER_SCORE: <span id="score">0</span></div>
                                                                                                                                                                    <video id="video-hidden" playsinline></video>

                                                                                                                                                                    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
                                                                                                                                                                    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
                                                                                                                                                                    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

                                                                                                                                                                    <script>
                                                                                                                                                                    /** --- CONFIG & CORE --- **/
                                                                                                                                                                    const VERSION = "0.4.1646424915";
                                                                                                                                                                    let score = 0;
                                                                                                                                                                    let canShoot = true;
                                                                                                                                                                    const targets = [];
                                                                                                                                                                    const particles = [];
                                                                                                                                                                    let smoothAim = new THREE.Vector3(0, 0, 0);

                                                                                                                                                                    const scene = new THREE.Scene();
                                                                                                                                                                    scene.fog = new THREE.Fog(0x020205, 5, 20);

                                                                                                                                                                    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                                                                                                                                                                    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                                                                                                                                                                    renderer.setSize(window.innerWidth, window.innerHeight);
                                                                                                                                                                    renderer.setPixelRatio(window.devicePixelRatio);
                                                                                                                                                                    document.body.appendChild(renderer.domElement);

                                                                                                                                                                    // Lighting
                                                                                                                                                                    const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
                                                                                                                                                                    scene.add(ambientLight);
                                                                                                                                                                    const pointLight = new THREE.PointLight(0x00fff2, 2, 50);
                                                                                                                                                                    pointLight.position.set(0, 5, 5);
                                                                                                                                                                    scene.add(pointLight);

                                                                                                                                                                    // Raycaster for precision
                                                                                                                                                                    const raycaster = new THREE.Raycaster();

                                                                                                                                                                    /** --- GRAPHICS: CROSSHAIR & LASER --- **/
                                                                                                                                                                    const crosshairGeo = new THREE.TorusGeometry(0.15, 0.01, 16, 32);
                                                                                                                                                                    const crosshairMat = new THREE.MeshBasicMaterial({ color: 0x00fff2 });
                                                                                                                                                                    const crosshair = new THREE.Mesh(crosshairGeo, crosshairMat);
                                                                                                                                                                    scene.add(crosshair);

                                                                                                                                                                    const laserMat = new THREE.LineBasicMaterial({ color: 0xff0033, transparent: true, opacity: 0.6 });
                                                                                                                                                                    const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -2, 0), new THREE.Vector3(0, 0, -10)]);
                                                                                                                                                                    const laserLine = new THREE.Line(laserGeo, laserMat);
                                                                                                                                                                    scene.add(laserLine);

                                                                                                                                                                    /** --- AUDIO --- **/
                                                                                                                                                                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                                                                                                                                                                    function playSFX(type) {
                                                                                                                                                                        const osc = audioCtx.createOscillator();
                                                                                                                                                                            const gain = audioCtx.createGain();
                                                                                                                                                                                if(type === 'hit') {
                                                                                                                                                                                        osc.type = 'square'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                                                                                                                                                                                                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
                                                                                                                                                                                                    } else {
                                                                                                                                                                                                            osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                                                                                                                                                                                                                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                                                                                                                                                                                                                        }
                                                                                                                                                                                                                            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                                                                                                                                                                                                                                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                                                                                                                                                                                                                                    osc.connect(gain); gain.connect(audioCtx.destination);
                                                                                                                                                                                                                                        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                        /** --- GAME OBJECTS --- **/
                                                                                                                                                                                                                                        function spawnTarget() {
                                                                                                                                                                                                                                            const group = new THREE.Group();
                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                    // Outer Ring
                                                                                                                                                                                                                                                        const ringGeo = new THREE.TorusGeometry(0.5, 0.04, 16, 100);
                                                                                                                                                                                                                                                            const ringMat = new THREE.MeshStandardMaterial({ color: 0x00fff2, emissive: 0x00fff2, emissiveIntensity: 2 });
                                                                                                                                                                                                                                                                const ring = new THREE.Mesh(ringGeo, ringMat);
                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                        // Inner Glow Core
                                                                                                                                                                                                                                                                            const coreGeo = new THREE.SphereGeometry(0.2, 16, 16);
                                                                                                                                                                                                                                                                                const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                                                                                                                                                                                                                                                                                    const core = new THREE.Mesh(coreGeo, coreMat);
                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                            group.add(ring);
                                                                                                                                                                                                                                                                                                group.add(core);
                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                        const side = Math.random() > 0.5 ? 1 : -1;
                                                                                                                                                                                                                                                                                                            group.position.set(side * 6, (Math.random() - 0.5) * 5, -8 - Math.random() * 5);
                                                                                                                                                                                                                                                                                                                group.velocity = new THREE.Vector3(-group.position.x * 0.008, -group.position.y * 0.008, 0.04);
                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                        scene.add(group);
                                                                                                                                                                                                                                                                                                                            targets.push(group);
                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                            function createExplosion(pos) {
                                                                                                                                                                                                                                                                                                                                for(let i=0; i<10; i++) {
                                                                                                                                                                                                                                                                                                                                        const pGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                                                                                                                                                                                                                                                                                                                                                const pMat = new THREE.MeshBasicMaterial({ color: 0x00fff2 });
                                                                                                                                                                                                                                                                                                                                                        const p = new THREE.Mesh(pGeo, pMat);
                                                                                                                                                                                                                                                                                                                                                                p.position.copy(pos);
                                                                                                                                                                                                                                                                                                                                                                        p.velocity = new THREE.Vector3((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2);
                                                                                                                                                                                                                                                                                                                                                                                p.life = 1.0;
                                                                                                                                                                                                                                                                                                                                                                                        scene.add(p);
                                                                                                                                                                                                                                                                                                                                                                                                particles.push(p);
                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                    /** --- AI & GESTURE --- **/
                                                                                                                                                                                                                                                                                                                                                                                                    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@${VERSION}/${file}` });
                                                                                                                                                                                                                                                                                                                                                                                                    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });

                                                                                                                                                                                                                                                                                                                                                                                                    let handData = null;
                                                                                                                                                                                                                                                                                                                                                                                                    hands.onResults(results => { handData = results.multiHandLandmarks?.[0] || null; });

                                                                                                                                                                                                                                                                                                                                                                                                    const videoElement = document.getElementById('video-hidden');
                                                                                                                                                                                                                                                                                                                                                                                                    const cameraUtils = new Camera(videoElement, {
                                                                                                                                                                                                                                                                                                                                                                                                        onFrame: async () => { await hands.send({image: videoElement}); },
                                                                                                                                                                                                                                                                                                                                                                                                            width: 640, height: 480
                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                            /** --- MAIN ENGINE --- **/
                                                                                                                                                                                                                                                                                                                                                                                                            function update() {
                                                                                                                                                                                                                                                                                                                                                                                                                requestAnimationFrame(update);

                                                                                                                                                                                                                                                                                                                                                                                                                    if (handData) {
                                                                                                                                                                                                                                                                                                                                                                                                                            // 1. Precise Aiming with Smoothing
                                                                                                                                                                                                                                                                                                                                                                                                                                    const indexTip = handData[8];
                                                                                                                                                                                                                                                                                                                                                                                                                                            const thumbTip = handData[4];
                                                                                                                                                                                                                                                                                                                                                                                                                                                    const indexBase = handData[5];
                                                                                                                                                                                                                                                                                                                                                                                                                                                            const wrist = handData[0];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const targetX = (0.5 - indexTip.x) * 15;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const targetY = (0.5 - indexTip.y) * 10;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            smoothAim.x += (targetX - smoothAim.x) * 0.2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    smoothAim.y += (targetY - smoothAim.y) * 0.2;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let finalPos = new THREE.Vector3(smoothAim.x, smoothAim.y, -8);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // 2. Magnetic Snap
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            targets.forEach(t => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (finalPos.distanceTo(t.position) < 1.8) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        finalPos.lerp(t.position, 0.3);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    crosshair.position.copy(finalPos);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            crosshair.rotation.z += 0.05;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    laserLine.geometry.setFromPoints([new THREE.Vector3(0, -2, 0), finalPos]);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // 3. Normalized Trigger Logic
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const handScale = Math.hypot(wrist.x - indexBase.x, wrist.y - indexBase.y);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const triggerDist = Math.hypot(thumbTip.x - indexBase.x, thumbTip.y - indexBase.y) / handScale;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (triggerDist < 0.45 && canShoot) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                fire(finalPos);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            canShoot = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        setTimeout(() => canShoot = true, 350);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Update Targets & Particles
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            targets.forEach((t, i) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    t.position.add(t.velocity);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            t.rotation.x += 0.02;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(t.position.z > 1) { scene.remove(t); targets.splice(i, 1); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            particles.forEach((p, i) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    p.position.add(p.velocity);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            p.life -= 0.02;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    p.material.opacity = p.life;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(p.life <= 0) { scene.remove(p); particles.splice(i, 1); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    while(targets.length < 4) spawnTarget();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        renderer.render(scene, camera);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function fire(aimPos) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const origin = new THREE.Vector3(0, -2, 0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const direction = new THREE.Vector3().subVectors(aimPos, origin).normalize();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    raycaster.set(origin, direction);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const hits = raycaster.intersectObjects(targets, true);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(hits.length > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let hitObj = hits[0].object;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    while(hitObj.parent && hitObj.parent !== scene) hitObj = hitObj.parent;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    createExplosion(hitObj.position);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            scene.remove(hitObj);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    targets.splice(targets.indexOf(hitObj), 1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            score += 150;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    playSFX('hit');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                playSFX('miss');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('score').innerText = score;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        cameraUtils.start().then(() => {
